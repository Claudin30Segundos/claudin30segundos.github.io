name: Claudin direct (responde CLAUDIN)
on:
  schedule:
    - cron: '*/20 * * * *'      # só pra garantir que sempre tem um plantão ativo
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['direct/vigia.sh', 'direct/ctas.json', '.github/workflows/direct.yml']
permissions:
  contents: write
concurrency:
  group: direct
  cancel-in-progress: false
jobs:
  plantao:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
      - name: Plantão (checa comentários a cada 45 s por ~55 min)
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: bash direct/vigia.sh
