name: baixar
on:
  push:
    paths: ['baixar/pedido.json']
  workflow_dispatch:
permissions:
  contents: write
concurrency: baixar
jobs:
  baixar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Baixa os arquivos pedidos
        run: |
          mkdir -p baixar/arquivos
          python3 - <<'PY'
          import json, urllib.request, os
          p = json.load(open('baixar/pedido.json'))
          for nome, url in p.items():
              dest = os.path.join('baixar/arquivos', nome)
              try:
                  urllib.request.urlretrieve(url, dest)
                  print('ok', nome, os.path.getsize(dest))
              except Exception as e:
                  print('ERRO', nome, e)
          PY
          git config user.name "claudin-bot"
          git config user.email "claudin-bot@users.noreply.github.com"
          git add baixar/arquivos
          git commit -m "baixar: arquivos" || true
          git pull --rebase origin main && git push
